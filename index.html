<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="__SITE_DESCRIPTION__"
    />
    <link rel="icon" type="image/x-icon" href="./favicon.ico?v=1" />
    <!-- SITE_IMAGE_PRELOADS -->
    <title>__SITE_TITLE__</title>
    <style>
      .startup-loader {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        background: #fff;
        opacity: 1;
        visibility: visible;
        transition: opacity 220ms ease, visibility 220ms ease;
      }

      .startup-loader.is-leaving {
        opacity: 0;
        visibility: hidden;
      }

      .startup-loader__content {
        width: 80vw;
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: clamp(20px, calc(4vw - 4px), 44px);
        font-weight: 500;
        line-height: 1.3;
        letter-spacing: -0.045em;
        text-align: center;
      }

      .startup-loader__text {
        display: inline-block;
        padding-bottom: 0.1em;
        white-space: nowrap;
        color: #565852;
        background: linear-gradient(
          90deg,
          #777c76 0%,
          #777c76 40%,
          #fff 50%,
          #777c76 60%,
          #777c76 100%
        );
        background-size: 250% 100%;
        background-position: 100% 0;
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: startup-loader-sheen 2s linear infinite;
      }

      .startup-loader.has-error .startup-loader__content {
        font-size: clamp(16px, 2.5vw, 24px);
        line-height: 1.4;
        letter-spacing: 0;
      }

      .startup-loader.has-error .startup-loader__text {
        white-space: normal;
        background: none;
        -webkit-text-fill-color: currentColor;
        animation: none;
      }

      @keyframes startup-loader-sheen {
        from { background-position: 100% 0; }
        to { background-position: 0 0; }
      }

      @media (prefers-reduced-motion: reduce) {
        .startup-loader {
          transition: none;
        }

        .startup-loader__text {
          background: none;
          -webkit-text-fill-color: currentColor;
          animation: none;
        }
      }

      @media (min-width: 901px) {
        .startup-loader__content {
          font-size: clamp(32px, calc(3vw - 4px), 38px);
        }
      }
    </style>
  </head>
  <body>
    <div id="startup-loader" class="startup-loader" role="status" aria-live="polite">
      <div class="startup-loader__content">
        <span class="startup-loader__text">__SITE_LOADING_TEXT__</span>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
